[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
strip = true
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Smaller program binary = less rent to deploy (opt for size, strip symbols).
[profile.release.package.held_quote]
opt-level = "z"
