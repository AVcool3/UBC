[package]
name = "held_quote"
version = "0.1.0"
description = "Price holds for binary outcome shares: buy now or hold an executable price, settled atomically on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "held_quote"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Declared so Anchor's macros don't emit "unexpected cfg" warnings.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
# init-if-needed lets buys create the buyer's share account on the fly.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
