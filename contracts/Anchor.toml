# Anchor workspace config for Ghost Checkout.
# `anchor keys sync` rewrites the program IDs below (and declare_id! in lib.rs)
# to match the keypair in target/deploy/ — run it once after cloning.

[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
ghost_checkout = "9TBWXeFennM42nASPhYY78vbNGiMQK252csS9TdgKxdD"

[programs.devnet]
ghost_checkout = "9TBWXeFennM42nASPhYY78vbNGiMQK252csS9TdgKxdD"

[provider]
# Change to "devnet" (or pass --provider.cluster devnet) when deploying.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
