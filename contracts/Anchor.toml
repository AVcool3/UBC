# Anchor workspace for Held Price (held_quote program).
# `anchor keys sync` rewrites the IDs below (and declare_id! in lib.rs)
# to match target/deploy/held_quote-keypair.json.

[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
held_quote = "32LnKdWnNk93W4C1pD4s3DjdTUAw4aGZZr6tbRMpw8e3"

[programs.devnet]
held_quote = "32LnKdWnNk93W4C1pD4s3DjdTUAw4aGZZr6tbRMpw8e3"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
